<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Key System - Verified</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 15px;
        }
        .success-card {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            padding: 30px 24px;
            text-align: center;
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px auto;
        }
        h2 { font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
        p { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; }
        .key-box-wrapper {
            background: #1f2937;
            border: 1px dashed #374151;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .key-label { font-size: 10px; text-transform: uppercase; color: #9ca3af; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .key-display {
            font-family: monospace;
            font-size: 15px;
            color: #38bdf8;
            background: #030712;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            word-break: break-all;
            user-select: all;
        }
        .btn-action {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: opacity 0.2s;
        }
        .btn-action:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">✓</div>
    <h2>Verification Successful!</h2>
    <p>Your secure daily access key has been generated. This key is valid for today only.</p>
    
    <div class="key-box-wrapper">
        <div class="key-label">Your Secure Key</div>
        <div class="key-display" id="keyText">Generating...</div>
    </div>

    <button class="btn-action" onclick="copyKey()">Copy Key to Clipboard</button>
</div>

<script>
    // Get current date in YYYYMMDD format for time-based expiry
    function getDateString() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}${month}${day}`;
    }

    function generateKey() {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let randomPart = "";
        for (let i = 0; i < 8; i++) {
            randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return "CYPHER-" + randomPart + "-" + getDateString();
    }

    // Check localStorage for an existing key created *today*
    const storageKey = "cypher_secure_key";
    const storageDateKey = "cypher_key_date";
    
    let savedKey = localStorage.getItem(storageKey);
    let savedDate = localStorage.getItem(storageDateKey);
    const currentDate = getDateString();

    // If date changed or no key exists, generate a fresh daily key
    if (!savedKey || savedDate !== currentDate) {
        savedKey = generateKey();
        localStorage.setItem(storageKey, savedKey);
        localStorage.setItem(storageDateKey, currentDate);
    }

    document.getElementById('keyText').innerText = savedKey;

    function copyKey() {
        navigator.clipboard.writeText(savedKey).then(() => {
            alert("Key copied successfully! Paste it into your executor loader.");
        });
    }
</script>

</body>
</html>
